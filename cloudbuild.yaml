# cloudbuild.yaml — Google Cloud Build CI/CD pipeline
# Triggered on every push to main branch
#
# Steps:
#   1. Build Docker image for Flask backend
#   2. Push to Google Artifact Registry
#   3. Deploy to Cloud Run
#   4. Deploy frontend to Firebase Hosting

substitutions:
  _REGION: us-central1
  _SERVICE: fraudshield-backend
  _REPO: fraudshield
  _IMAGE: gcr.io/$PROJECT_ID/${_REPO}/${_SERVICE}

steps:
  # ── 1. Build the backend Docker image ──────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-image
    dir: scampay/backend
    args:
      - build
      - -t
      - '${_IMAGE}:$COMMIT_SHA'
      - -t
      - '${_IMAGE}:latest'
      - -f
      - Dockerfile
      - .

  # ── 2. Push image to Google Container Registry ─────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push-image
    waitFor: [build-image]
    args:
      - push
      - '--all-tags'
      - '${_IMAGE}'

  # ── 3. Deploy to Cloud Run ─────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-backend
    waitFor: [push-image]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_IMAGE}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=120'
      - '--set-env-vars=FLASK_ENV=production'
      - '--update-secrets=WATSONX_API_KEY=WATSONX_API_KEY:latest,WATSONX_PROJECT_ID=WATSONX_PROJECT_ID:latest,GOOGLE_SAFE_BROWSING_KEY=GOOGLE_SAFE_BROWSING_KEY:latest,FLASK_SECRET_KEY=FLASK_SECRET_KEY:latest'

  # ── 4. Deploy frontend to Firebase Hosting ─────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-frontend
    waitFor: [deploy-backend]
    dir: scampay
    entrypoint: bash
    args:
      - -c
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --project $PROJECT_ID --token $$FIREBASE_TOKEN
    secretEnv: ['FIREBASE_TOKEN']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_TOKEN/versions/latest
      env: 'FIREBASE_TOKEN'

images:
  - '${_IMAGE}:$COMMIT_SHA'
  - '${_IMAGE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
